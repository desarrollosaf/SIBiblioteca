<section class="hero-books">
  <div class="hero-books-inner">
    <div class="hero-books-text">
      <h1>Explora la biblioteca</h1>
      <p>
        Consulta el catálogo digital, revisa disponibilidad y descubre nuevas
        lecturas con un solo clic.
      </p>

      <form [formGroup]="formRegistros" class="hero-books-form">
        <input type="text" formControlName="busqueda" (keyup)="buscar()" class="form-control"  placeholder="Escribe el título, autor o tema...">
        <button type="submit">Buscar libro</button>
      </form>

      <div class="hero-books-meta">
        <span>📚 Más de 1,000 ejemplares registrados</span>
        <span>⏱ Búsqueda rápida por palabras clave</span>
      </div>
    </div>

    <div class="hero-books-illustration">
      <div class="books-shelf">
        <div class="book b1"></div>
        <div class="book b2"></div>
        <div class="book b3"></div>
        <div class="book b4"></div>
        <div class="book b5"></div>
      </div>
      <p>Catálogo digital del sistema de biblioteca</p>
    </div>
  </div>
</section>
